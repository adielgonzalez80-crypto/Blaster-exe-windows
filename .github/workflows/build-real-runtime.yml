name: Build BLASTER real Windows runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build-runtime/**"
      - ".github/workflows/build-real-runtime.yml"
      - "app/src/main/java/com/blaster/exeandroid/MainActivity.java"

jobs:
  runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools ndk;27.2.12479018"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git pkg-config \
            gcc-multilib g++-multilib flex bison gettext \
            python3 perl autoconf automake libtool \
            libx11-dev libfreetype-dev libfontconfig1-dev \
            libxext-dev libxrender-dev libxi-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxfixes-dev \
            libgl-dev libvulkan-dev debootstrap ca-certificates

      - name: Verify Android NDK
        run: |
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Build source runtime
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          chmod +x tools/build-runtime/build-real-runtime.sh
          chmod +x tools/build-runtime/launch-windows.real.sh
          tools/build-runtime/build-real-runtime.sh

      - name: Package runtime
        run: |
          cd dist/blaster-runtime
          zip -r ../blaster-windows-runtime-real.zip .
          cd ..
          unzip -l blaster-windows-runtime-real.zip
          unzip -Z1 blaster-windows-runtime-real.zip | grep -Fx "launch-windows"
          unzip -Z1 blaster-windows-runtime-real.zip | grep -Fx "bin/box64"
          unzip -Z1 blaster-windows-runtime-real.zip | grep -Fx "wine/usr/local/bin/wine64"
          unzip -Z1 blaster-windows-runtime-real.zip | grep -Fx "runtime.json"

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: blaster-windows-runtime-real
          path: dist/blaster-windows-runtime-real.zip
          if-no-files-found: error
